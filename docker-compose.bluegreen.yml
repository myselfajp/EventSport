# EventSport — blue/green production stack.
#
# Same compose project as docker-compose.yml (`name: eventsport`) so both files
# address the same containers, network and volume. This file is what production
# runs; docker-compose.yml is kept for local/dev use.
#
# Shape:
#   mongodb              one shared instance — the database is NOT duplicated
#   backend_{blue,green} two copies of the app, only one receiving traffic
#   frontend_{blue,green}
#   nginx                always up, points at whichever colour is active
#
# Only the colour named by the active profile starts:
#     docker compose -f docker-compose.bluegreen.yml --profile green up -d
# Services of the other profile are left running untouched, which is what makes
# the flip zero-downtime: both colours are up at once for a few seconds.
name: eventsport

# Backend env is identical for both colours — defined once, anchored into both.
x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV}
  PORT: ${BACKEND_PORT}
  MONGODB_URI: ${MONGODB_URI}
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME}
  ADMIN_LAST_NAME: ${ADMIN_LAST_NAME}
  ADMIN_PHONE: ${ADMIN_PHONE}
  ADMIN_AGE: ${ADMIN_AGE}
  LISTING_PRICE_PER_SLOT: ${LISTING_PRICE_PER_SLOT}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASS: ${SMTP_PASS}
  SMTP_FROM: ${SMTP_FROM}
  SMTP_SECURE: ${SMTP_SECURE}
  CHECK_IN_REMINDERS_ENABLED: ${CHECK_IN_REMINDERS_ENABLED}
  CHECK_IN_REMINDER_INTERVAL_MS: ${CHECK_IN_REMINDER_INTERVAL_MS}
  ACCOUNT_ANONYMIZATION_ENABLED: ${ACCOUNT_ANONYMIZATION_ENABLED}
  ACCOUNT_ANONYMIZATION_INTERVAL_MS: ${ACCOUNT_ANONYMIZATION_INTERVAL_MS}
  ACCOUNT_DELETION_RETENTION_MONTHS: ${ACCOUNT_DELETION_RETENTION_MONTHS}
  PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL}
  FRONTEND_URL: ${FRONTEND_URL}

x-backend-common: &backend-common
  image: ${BACKEND_IMAGE}
  environment: *backend-env
  # Uploads are user data on the host, shared by both colours: a file uploaded
  # to green must still be there after a flip back to blue.
  volumes:
    - ./backEnd/uploads:/app/uploads
  depends_on:
    mongodb:
      condition: service_healthy
  networks:
    - eventsport_network
  restart: unless-stopped

x-frontend-common: &frontend-common
  image: ${FRONTEND_IMAGE}
  environment:
    NODE_ENV: ${NODE_ENV}
    PORT: ${FRONTEND_PORT}
  networks:
    - eventsport_network
  restart: unless-stopped

services:
  mongodb:
    image: mongo:7
    container_name: ${MONGO_CONTAINER_NAME}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    command: mongod --quiet --logpath /dev/null
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventsport_network
    restart: unless-stopped
    logging:
      driver: "none"

  backend_blue:
    <<: *backend-common
    container_name: eventSport_backend_blue
    profiles: ["blue"]

  backend_green:
    <<: *backend-common
    container_name: eventSport_backend_green
    profiles: ["green"]

  frontend_blue:
    <<: *frontend-common
    container_name: eventSport_frontend_blue
    profiles: ["blue"]

  frontend_green:
    <<: *frontend-common
    container_name: eventSport_frontend_green
    profiles: ["green"]

  nginx:
    image: nginx:alpine
    container_name: ${NGINX_CONTAINER_NAME}
    ports:
      - "${HTTP_PORT}:80"
    # No depends_on for the app containers: nginx must survive a colour being
    # absent. eventsport.conf resolves upstreams at request time through the
    # Docker resolver, so a missing colour is a 502 on that request, not a
    # refusal to start.
    volumes:
      - ./nginx/eventsport.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/active-color.conf:/etc/nginx/conf.d/00-active-color.conf:ro
    networks:
      - eventsport_network
    restart: unless-stopped

# !!! DO NOT EDIT THIS BLOCK !!!
# The production database lives in the pre-existing volume named below.
# `external: true` means compose only ever attaches to it: it will not create it,
# and `docker compose down -v` will not delete it.
#
# Dropping `external`/`name` makes compose silently create a NEW EMPTY volume
# (<project>_mongodb_data) and mount that instead. The old data is not deleted,
# but the app comes up blank — this already happened once on 2026-06-16 and left
# an orphan volume `eventsport_mongodb_data` behind.
#
# scripts/deploy-bluegreen.sh asserts this pairing before every deploy.
volumes:
  mongodb_data:
    external: true
    name: eventsport_mongodb_data_prod

networks:
  eventsport_network:
    driver: bridge
