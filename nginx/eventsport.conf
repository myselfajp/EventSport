# EventSport — single entry point (only this :80 is exposed externally).
# backend/frontend containers do not publish ports to the host; nginx reaches them
# by service name over the Docker network.
# Docker DNS (127.0.0.11) + variable upstream: avoids 502 when containers are
# recreated and old IPs are stale.

server {
    listen 80;
    server_name _;

    # Body size limit for uploads (multer)
    client_max_body_size 25m;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # --- Socket.io (WebSocket) ---
    # Must come before /api/: proxy to backend with WebSocket upgrade headers.
    location /socket.io/ {
        set $socket_upstream http://backend:3000;
        proxy_pass $socket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Backend API ---
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Uploaded files (served statically by backend) ---
    location /uploads/ {
        set $uploads_upstream http://backend:3000;
        proxy_pass $uploads_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend (Next.js) ---
    location / {
        set $frontend_upstream http://frontend:3001;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
